<script>
        document.addEventListener('DOMContentLoaded', () => {
            const bootScreen = document.getElementById('boot-screen');
            const homeScreen = document.getElementById('home-screen');
            const bootTextLink = document.getElementById('boot-text-link');
            const bootTextInit = document.getElementById('boot-text-init');
            const bootTextReady = document.getElementById('boot-text-ready');

            // Boot Sequence Logic
            setTimeout(() => {
                bootTextLink.classList.remove('opacity-0');
                bootTextLink.classList.add('opacity-100');
            }, 500);

            setTimeout(() => {
                bootTextInit.classList.remove('opacity-0');
                bootTextInit.classList.add('opacity-100');
            }, 1500);

            setTimeout(() => {
                bootTextReady.classList.remove('opacity-0');
                bootTextReady.classList.add('opacity-100');
            }, 2500);

            setTimeout(() => {
                bootScreen.style.display = 'none';
                homeScreen.style.display = 'flex';
            }, 3500);

            // Hardware Keyboard visual feedback
            const keys = document.querySelectorAll('[data-key]');
            
            function triggerKeyVisual(keyVal) {
                const keyEl = Array.from(keys).find(k => k.dataset.key.toLowerCase() === keyVal.toLowerCase());
                if (keyEl) {
                    keyEl.classList.add('active');
                    setTimeout(() => keyEl.classList.remove('active'), 150);
                }
            }

            document.addEventListener('keydown', (e) => {
                let keyToTrigger = e.key;
                if(e.code === 'Space') keyToTrigger = ' ';
                triggerKeyVisual(keyToTrigger);
            });

            // Click support for on-screen physical keys
            keys.forEach(key => {
                key.addEventListener('mousedown', function() {
                    this.classList.add('active');
                });
                key.addEventListener('mouseup', function() {
                    this.classList.remove('active');
                });
                key.addEventListener('mouseleave', function() {
                    this.classList.remove('active');
                });
                // Touch support
                key.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    this.classList.add('active');
                });
                key.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    this.classList.remove('active');
                });
            });
        });
    </script>
